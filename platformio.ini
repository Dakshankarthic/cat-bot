[platformio]
default_envs = esp32s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo @ 3.0.9
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:lolin_s2_mini]
board = lolin_s2_mini
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev]
board = esp32dev